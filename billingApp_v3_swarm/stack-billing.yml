services:
#database engine service
  postgres_db_prod:
    #container_name: postgres
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    volumes:
        #allow *.sql, *.sql.gz, or *.sh and is execute only if data directory is empty
      - ./dbfiles:/docker-entrypoint-initdb.d
      - /var/lib/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qweerty
      POSTGRES_DB: postgres

#database admin service
  adminer:
    #container_name: adminer
    image: adminer
    restart: always
    depends_on: 
      - postgres_db_prod
    ports:
       - 9090:8080


#Billin app backend service
  billingapp-back:
    build:
      context: ./java
      args:
        - JAR_FILE=*.jar
    image: billingapp_v2_billingapp-back:latest
    #container_name: billingApp-back      
    environment:
       - JAVA_OPTS=
         -Xms256M
         -Xmx256M
    depends_on:     
      - postgres_db_prod
    ports:
      - 8080:8080


#Billin app frontend service
  billingapp-front:
    build:
      context: ./angular
    image: billingapp_v2_billingapp-front:latest
    deploy: 
        replicas: 3
        resources:
           limits: 
              cpus: "0.15"
              memory: 250M
           reservations:
              cpus: "0.1"
              memory: 128M
    #container_name: billingApp-front
    depends_on:     
      - billingapp-back
#rango de puertos para escalar    
    ports:
      - 85:80 
